[project]
name = "predictor-debugger"
version = "1.0.0"
description = "Pre-registered physics debugger for a learned 3D Navier-Stokes predictor"
requires-python = ">=3.9"
dependencies = ["numpy==1.26.4"]

[dependency-groups]
train = ["torch==2.7.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
